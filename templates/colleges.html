{% extends "base.html" %}
{% block title %}Colleges - RankPath{% endblock %}
{% block content %}
<h1>Colleges ({{ colleges|length }})</h1>
<table>
  <thead><tr><th>Name</th><th>State</th><th>Type</th></tr></thead>
  <tbody>
    {% for c in colleges %}
    <tr>
      <td><a href="/college/{{ c.id }}">{{ c.name }}</a></td>
      <td>{{ c.state }}</td>
      <td>{{ c.type }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
